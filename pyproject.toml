[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony"
version = "0.1.0"
description = "Classical four-part harmony solver based on the Brigada textbook."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "mido>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]
desktop = [
    "pywebview>=5.0.0",
    "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# .redteam/scratch — исторические redteam-скрипты (одноразовые охоты/зонды),
# вне скоупа продуктовой гигиены кода.
extend-exclude = [".redteam/scratch"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402 намеренный: скрипты бутстрапят sys.path (корень проекта) ДО импортов src.harmony.*,
# чтобы работать без установленного пакета. Перестановка ломает запуск.
"scripts/*" = ["E402"]
# E402 намеренный: runtime compat-guard (monkey-patch engine.validate_voice_leading,
# дефект M3) стоит МЕЖДУ импортами и должен отработать до импорта solver/export.
# Перенос импортов наверх меняет порядок side-effects на import.
"src/harmony/pipeline.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
]
